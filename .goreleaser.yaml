version: 2

project_name: kayra

builds:
  - id: kayra
    main: ./cmd/kayra
    binary: kayra
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: kayra
    ids: [kayra]
    name_template: >-
      kayra_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/kayra.yaml
      - examples/kayra-users.yaml

checksum:
  name_template: "checksums.txt"

# The container image, multi-platform, on every release: the binary above
# in the Dockerfile at the repository root. Tags: the version
# (0.5.0), its minor (0.5) and latest, the last two only for a release
# that is not a pre-release. The CI logs in to ghcr.io first.
dockers_v2:
  - id: kayra
    ids: [kayra]
    dockerfile: Dockerfile
    images:
      - ghcr.io/infrapi/kayra
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: kayra
      org.opencontainers.image.description: Kayra, InfraPI's API catalog, RBAC and reconciler
      org.opencontainers.image.source: https://github.com/infrapi/kayra
      org.opencontainers.image.url: https://github.com/infrapi/kayra
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT

# go-semantic-release (see .github/workflows/ci.yml) already tags and
# creates the GitHub release with its own generated notes before this
# ever runs (see .github/workflows/release.yml, triggered by that same
# tag push) — append the built artifacts to that release rather than
# replacing it or writing a second, conflicting changelog.
release:
  mode: append

changelog:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"
