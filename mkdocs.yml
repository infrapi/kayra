site_name: Kayra
site_description: Authentication, namespace creation and IAM policy service.
site_url: https://infrapi.github.io/kayra/
repo_url: https://github.com/infrapi/kayra
repo_name: infrapi/kayra
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 InfraPI - MIT License

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Geist
    code: Geist Mono

extra_css:
  - assets/stylesheets/theme.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      # keeps `mkdocs build` working on files that are not committed yet
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - RBAC & auth: architecture/rbac-and-auth.md
      - Stacks: architecture/stacks.md
      - Namespaces: architecture/namespaces.md
      - Subscriptions & reconciliation: architecture/subscriptions.md
  - CLI: cli.md
  - Packages:
      - apiserver: packages/apiserver.md
      - authn: packages/authn.md
      - authz: packages/authz.md
      - clicontext: packages/clicontext.md
      - config: packages/config.md
      - crypto: packages/crypto.md
      - httpapi: packages/httpapi.md
      - middleware: packages/middleware.md
      - oauth2broker: packages/oauth2broker.md
      - oauth2login: packages/oauth2login.md
      - oidc: packages/oidc.md
      - rbac: packages/rbac.md
      - store: packages/store.md
      - tokenapi: packages/tokenapi.md
  - Development: development.md
