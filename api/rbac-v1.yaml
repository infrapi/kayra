      tags: ['Cluster groups']
      summary: The cluster groups.
      responses:
        '200':
          description: The cluster groups.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Group'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createClusterGroup
      tags: ['Cluster groups']
      summary: Create a cluster group, or replace the one of that name.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Group'}
      responses:
        '201':
          description: The cluster group.
          content:
