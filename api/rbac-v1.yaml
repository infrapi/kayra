      - $ref: '#/components/parameters/group'
    get:
      operationId: getClusterGroup
      tags: ['Cluster groups']
      summary: A cluster group.
      responses:
        '200':
          description: The cluster group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateClusterGroup
      tags: ['Cluster groups']
      summary: Replace a cluster group; its name stays.
      requestBody:
