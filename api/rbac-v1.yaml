# Kayra's rbac API, the authorization group, version v1: the RBAC (cluster and namespace
# groups, roles and role bindings), the namespaces' service accounts, the
# personal access tokens, and /check, which every app built on infrapi/lib
# asks. Served at /apis/authorization.<api_domain>/v1: written for the
# domain infrapi.io, Kayra serves it under its own (app.api_domain), the
# contract rewritten.
#
# Edit it, then infrapi-cli app generate (go generate ./api).
openapi: 3.0.3
info:
  title: rbac
  version: v1
  x-infrapi-group: authorization.infrapi.io
  description: >-
    Who may do what. Cluster objects are global when their
    metadata.namespace is empty, granting cluster-scoped resources; scoped
    to a namespace otherwise, granting managing it. Namespace objects grant
    what a namespace's members do there.

security:
  - bearer: []

tags:
  - name: Check
    description: "Whether the caller may do a request: what every app built on infrapi/lib asks."
  - name: Cluster groups
    description: "Who, on the cluster: global when metadata.namespace is empty, managing a namespace otherwise."
  - name: Cluster roles
    description: "What, on the cluster: the rules a cluster role binding grants."
  - name: Cluster role bindings
    description: "A cluster role granted to cluster groups."
  - name: Groups
    description: "Who, in a namespace: its members."
  - name: Roles
    description: "What, in a namespace: the rules a role binding grants."
  - name: Role bindings
    description: "A namespace role granted to the namespace's groups."
  - name: Service accounts
    description: "A namespace's machine identities, and their tokens."
  - name: Personal access tokens
    description: "A user's tokens: opaque, expiring, optionally scoped."

paths:
  /apis/authorization.infrapi.io/v1/check:
    post:
      operationId: check
      tags: ['Check']
      summary: Whether the caller may do a request, as an app built on infrapi/lib asks.
      description: >-
        The caller is the request's own token. A request in no namespace is
        decided on the cluster RBAC; one in a namespace, on its membership,
        its subscription to the API, the API's contract, then its roles. A
        denial is a 200 with allowed false and the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckRequest'}
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckResponse'}
        default: {$ref: '#/components/responses/Problem'}

  /apis/authorization.infrapi.io/v1/clustergroups:
    get:
