components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token of Kayra's (infrapi-cli auth login), or a personal access token.

  parameters:
    namespace:
      name: namespace
      in: path
      required: true
      description: The namespace.
      schema: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
    group:
      name: group
      in: path
      required: true
      description: The group's name.
      schema: {type: string}
    role:
      name: role
      in: path
      required: true
      description: The role's name.
      schema: {type: string}
    rolebinding:
      name: rolebinding
      in: path
      required: true
      description: The role binding's name.
      schema: {type: string}
    serviceaccount:
      name: serviceaccount
      in: path
      required: true
      description: The service account's name.
      schema: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
    token:
      name: id
      in: path
      required: true
      description: The token's id.
      schema: {type: string}
    user:
      name: user
      in: query
      description: Another user's tokens, by user id; the caller's when empty.
      schema: {type: string}

  responses:
    Problem:
      description: An error, as a problem document (RFC 9457).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      description: An error, as infrapi/lib renders it.
      required: [status, title]
      properties:
        status: {type: integer, description: The HTTP status.}
        title: {type: string, description: The kind of problem.}
        detail: {type: string, description: This occurrence of it.}
        code: {type: string, description: A stable code to branch on.}
        solution: {type: string, description: What to do about it.}
        retryable: {type: boolean, description: Whether the same request may succeed later.}

    JWKS:
      type: object
      nullable: true
      description: Public keys, as a JSON Web Key Set.
      required: [keys]
      properties:
        keys:
          type: array
          description: The keys.
          items: {$ref: '#/components/schemas/JWK'}

    JWK:
      type: object
      description: 'A public key, a JSON Web Key: never a private one (d).'
      additionalProperties: false
      required: [kty]
      properties:
        kty: {type: string, description: 'Its type: RSA or EC.'}
        kid: {type: string, description: Its id.}
        use: {type: string, description: 'What it is for, sig.'}
        alg: {type: string, description: 'Its algorithm, RS256.'}
        n: {type: string, description: An RSA key's modulus.}
        e: {type: string, description: An RSA key's exponent.}
        crv: {type: string, description: 'An EC key''s curve: P-256, P-384, P-521.'}
        x: {type: string, description: An EC key's x.}
        y: {type: string, description: An EC key's y.}

    FederatedCredential:
      type: object
      description: A platform's identity token trusted as the identity, a CI job's say.
      required: [name, issuer]
      properties:
        name: {type: string, description: 'What tells it apart, gitlab-main.'}
        issuer: {type: string, description: 'The token''s iss, one of Kayra''s federation.issuers: https://gitlab.example.com.'}
        subject: {type: string, description: 'Its sub, exactly.'}
        claims:
          type: object
          description: Other claims it must carry, each exactly, a boolean as "true".
          additionalProperties: {type: string}
        audience: {type: string, description: 'What its aud must hold, Kayra''s URL when empty.'}

    Metadata:
      type: object
      description: Where an RBAC object applies.
      properties:
        namespace:
          type: string
          description: >-
            Its namespace. A namespace object's is the path's when empty. A
            cluster object is global when empty, scoped to the namespace
            otherwise.
        region: {type: string, description: Its region.}
        platform: {type: string, description: Its platform.}

    Group:
      type: object
      description: >-
        Who: external groups, users, the namespace's service accounts and
        registered APIs. Any one list is enough to be a member; an entry of
        groups or users may be "*".
      required: [name]
      properties:
        name: {type: string, description: Its name.}
        description: {type: string, description: What it is.}
        metadata: {$ref: '#/components/schemas/Metadata'}
        groups:
          type: array
          description: Groups, as Kayra resolves a caller's, sandbox-sre-sysadmin; never a DN.
          items: {type: string}
        users:
          type: array
          description: Users, by their id.
          items: {type: string}
        serviceaccounts:
          type: array
          description: Service accounts of the group's own namespace, by name; a namespace group's only.
          items: {type: string}
        apis:
          type: array
          description: Registered APIs, by group, calling with their own identity; exact names.
          items: {type: string}
        created_at: {type: string, format: date-time, readOnly: true, description: When it was created.}
        updated_at: {type: string, format: date-time, readOnly: true, description: When it was last written.}

    Rule:
      type: object
      description: What a role grants; each entry may be "*".
      properties:
        apis:
          type: array
          description: API groups, compute.infrapi.io.
          items: {type: string}
        resources:
          type: array
          description: Resources, vms, or actions, vms/reboot.
          items: {type: string}
        verbs:
          type: array
          description: get, list, create, update, patch, delete; escalate and bind on roles and bindings.
          items: {type: string}

    Role:
      type: object
      description: A named set of rules.
      required: [name]
      properties:
        name: {type: string, description: Its name.}
        description: {type: string, description: What it is.}
        metadata: {$ref: '#/components/schemas/Metadata'}
        rules:
          type: array
          description: What it grants.
          items: {$ref: '#/components/schemas/Rule'}
        created_at: {type: string, format: date-time, readOnly: true, description: When it was created.}
        updated_at: {type: string, format: date-time, readOnly: true, description: When it was last written.}

    RoleBinding:
      type: object
      description: A role granted to groups, of the same metadata.
      required: [name, role]
      properties:
        name: {type: string, description: Its name.}
        description: {type: string, description: What it is.}
        metadata: {$ref: '#/components/schemas/Metadata'}
        role: {type: string, description: 'The role, by name.'}
        groups:
          type: array
          description: The groups, by name.
          items: {type: string}
        created_at: {type: string, format: date-time, readOnly: true, description: When it was created.}
        updated_at: {type: string, format: date-time, readOnly: true, description: When it was last written.}

    ServiceAccount:
      type: object
      description: >-
        A namespace's machine identity, system:serviceaccount:<namespace>:<name>.
        It holds no secret: its tokens are asked for, short-lived.
      required: [name]
      properties:
        name: {type: string, description: 'Its name, a DNS label.', pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
        description: {type: string, description: What it is.}
        metadata: {$ref: '#/components/schemas/Metadata'}
        uid:
          type: string
          readOnly: true
          description: Set at creation; its tokens carry it, so a deleted one's are refused.
        jwks: {$ref: '#/components/schemas/JWKS'}
        federated_credentials:
          type: array
          description: Platforms' identity tokens trusted as it, a CI job's say.
          items: {$ref: '#/components/schemas/FederatedCredential'}
        created_at: {type: string, format: date-time, readOnly: true, description: When it was created.}
        updated_at: {type: string, format: date-time, readOnly: true, description: When it was last written.}

    ServiceAccountTokenRequest:
      type: object
      description: A service account token's lifetime and audience.
      properties:
        expires_in: {type: string, description: 'Its lifetime, a duration: 1h; Kayra''s default when empty.'}
        audience:
          type: array
          description: The resources it is for; the first of Kayra's when empty.
          items: {type: string}

    ServiceAccountToken:
      type: object
      description: A service account's token.
      required: [token, expires_at]
      properties:
        token: {type: string, description: 'The token, a JWT.'}
        expires_at: {type: string, format: date-time, description: When it expires.}

    TokenScope:
      type: object
      description: What a personal access token may do, whatever its user's roles; each entry may be "*".
      required: [apis, verbs]
      properties:
        apis:
          type: array
          description: API groups, compute.infrapi.io.
          items: {type: string}
        verbs:
          type: array
          description: get, list, create, update, patch, delete.
          items: {type: string}

    Token:
      type: object
      description: A user's personal access token.
      required: [name]
      properties:
        id: {type: string, readOnly: true, description: Its id.}
        name: {type: string, description: 'What it is for, laptop: 64 characters at most.', maxLength: 64}
        user: {type: string, readOnly: true, description: Its user.}
        expires_in:
          type: string
          writeOnly: true
          description: 'Its lifetime, a duration: 720h; Kayra''s default when empty.'
        scope: {$ref: '#/components/schemas/TokenScope'}
        created_at: {type: string, format: date-time, readOnly: true, description: When it was created.}
        expires_at: {type: string, format: date-time, readOnly: true, description: When it expires.}
        last_used_at: {type: string, format: date-time, readOnly: true, description: When it was last used.}
        token: {type: string, readOnly: true, description: 'Its secret, at its creation only.'}

    CheckRequest:
      type: object
      description: A request an app received, as infrapi/lib takes it apart.
      required: [api, resource, verb]
      properties:
        namespace: {type: string, description: Its namespace; empty for a cluster-scoped resource.}
        api: {type: string, description: 'The app''s API group, compute.infrapi.io.'}
        resource: {type: string, description: 'The resource, vms, or action, vms/reboot.'}
        verb: {type: string, description: 'get, list, create, update, patch or delete.'}
        name: {type: string, description: 'The object it names, when it names one.'}
        request_id: {type: string, description: 'The request''s id, for the audit.'}
        source_ip: {type: string, description: 'The caller''s address, as the app saw it, for the audit.'}
        user_agent: {type: string, description: 'The caller''s agent, for the audit.'}

    CheckResponse:
      type: object
      description: A decision.
      required: [allowed]
      properties:
        allowed: {type: boolean, description: Whether the caller may.}
        reason: {type: string, description: 'Why not, when it may not.'}
        user: {type: string, description: The caller's subject.}
