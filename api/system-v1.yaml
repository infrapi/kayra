# Kayra's system API, version v1: the namespaces every other API's
# resources, RBAC and subscriptions live in. Served at
# /apis/system.<api_domain>/v1: written for the domain infrapi.io, Kayra
# serves it under its own (app.api_domain), the contract rewritten.
#
# Edit it, then infrapi-cli app generate (go generate ./api): the schemas
# as Go types in api/zz_generated.go, the operations as Handlers in
# internal/system/zz_generated.go.
openapi: 3.0.3
info:
  title: system
  version: v1
  x-infrapi-group: system.infrapi.io
  description: >-
    Kayra's namespaces. A namespace is the unit of isolation an API's
    resources, their RBAC and subscriptions live in; a tenant (a team, a
    customer) owns one or several.

security:
  - bearer: []

tags:
  - name: Namespaces
    description: "The units of isolation every API works in."

paths:
  /apis/system.infrapi.io/v1/namespaces:
    get:
      operationId: listNamespaces
      tags: ['Namespaces']
      summary: The namespaces the caller sees, by name.
      description: >-
        Whoever the cluster RBAC grants list on namespaces sees every one;
        anyone else the namespaces they are a member of.
      responses:
        '200':
          description: The namespaces.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Namespace'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createNamespace
      tags: ['Namespaces']
      summary: Create a namespace, or keep the one of that name.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Namespace'}
      responses:
        '201':
          description: The namespace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Namespace'}
        default: {$ref: '#/components/responses/Problem'}

  /apis/system.infrapi.io/v1/namespaces/{namespace}:
    parameters:
      - $ref: '#/components/parameters/namespace'
    get:
      operationId: getNamespace
      tags: ['Namespaces']
      summary: A namespace, for the cluster RBAC's readers and its members.
      responses:
        '200':
          description: The namespace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Namespace'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteNamespace
      tags: ['Namespaces']
      summary: Delete a namespace.
      responses:
        '204': {description: Deleted.}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token of Kayra's (infrapi-cli auth login), or a personal access token.

  parameters:
    namespace:
      name: namespace
      in: path
      required: true
      description: The namespace.
      schema: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}

  responses:
    Problem:
      description: An error, as a problem document (RFC 9457).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      description: An error, as infrapi/lib renders it.
      required: [status, title]
      properties:
        status: {type: integer, description: The HTTP status.}
        title: {type: string, description: The kind of problem.}
        detail: {type: string, description: This occurrence of it.}
        code: {type: string, description: A stable code to branch on.}
        solution: {type: string, description: What to do about it.}
        retryable: {type: boolean, description: Whether the same request may succeed later.}

    Namespace:
      type: object
      description: A namespace.
      required: [name, active]
      properties:
        name:
          type: string
          description: Its name, a DNS label.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
        active:
          type: boolean
          readOnly: true
          description: Set by the reconciler once the namespace is provisioned.
        created_at: {type: string, format: date-time, readOnly: true, description: When it was created.}
        updated_at: {type: string, format: date-time, readOnly: true, description: When it was last written.}
