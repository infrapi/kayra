name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint and security tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Format
        run: make fmt

      - name: Check formatting
        run: git diff --exit-code

      - name: Lint
        run: make lint

      - name: Security
        run: make security

      - name: Test
        run: make test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

      # go-semantic-release creates the tag via the GitHub API using
      # GITHUB_TOKEN — events from that token never cascade into other
      # workflows (GitHub's own anti-loop protection), so a separate
      # workflow listening for `push: tags` would never fire. Running
      # GoReleaser right here, in the same job, sidesteps that entirely.
      # semrel's own `version` output is empty when this push triggered
      # no release (e.g. no releasable commits), so there's nothing to
      # build.
      - name: Fetch the tag semantic-release just created
        if: steps.semrel.outputs.version != ''
        run: git fetch --tags origin

      # go-semantic-release leaves its own working notes (e.g.
      # .generated-go-semantic-release-changelog.md, .semrel/) behind as
      # untracked files — GoReleaser refuses to run against a dirty git
      # state. -x also clears gitignored files, harmless here since
      # nothing before GoReleaser's own build needs any of them.
      - name: Clean up go-semantic-release's own working files
        if: steps.semrel.outputs.version != ''
        run: git clean -ffdx

      - uses: actions/setup-go@v7
        if: steps.semrel.outputs.version != ''
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        if: steps.semrel.outputs.version != ''
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
