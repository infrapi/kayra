# Example Kayra configuration, corrected and runnable. Pick ONE entry
# under database: that you actually want active — Kayra requires
# exactly one. authorizations: is different: it's a
# named map, and every authentifications.<name> entry picks which one of
# its entries authorizes it, so several can (and here do) stay active
# side by side — each still needs exactly one of ldap/local/claims set.

# app: is infrapi/lib's own shared INFRAPI_APP_* bootstrap config,
# authored here instead of a separate dotenv file — see
# config.AppConfig.ToVariables, which flattens it into the
# INFRAPI_APP_NAME/_PLATFORM/etc. keys libconfig.NewConfigFromMap expects.
app:
  name: "auth"
  fqdn: "localhost.local"
  url: "http://localhost:8080"
  platform: "sandbox"
  region: "eu-west-1"
  location: "dc1"
  listen_type: "tcp"
  listen_address: "0.0.0.0:8080"
  # api_domain names this deployment's own API groups — every route
  # mounts under "/apis/<group>.<api_domain>/v1/...", and every
  # Role.Rules entry you author must name that same URN. Defaults to
  # "example.com" when omitted; set it to a domain you actually control.
  api_domain: "example.com"

database:
  main:
    etcd:
      host:
        - "https://etcd0101e1.domain:2379"
        - "https://etcd0101e2.domain:2379"
        - "https://etcd0101e3.domain:2379"
      prefix: "/kayra"
      timeout: 30
      tls:
        verify: true
        cacert: "/usr/local/auth/conf/cacert.pem"
        key: "/usr/local/auth/conf/etcd_key.pem"
        cert: "/usr/local/auth/conf/etcd_cert.pem"

  # dev:
  #   local:
  #     path: /tmp/kayra-db

authentifications:
  okta:
    authorization: okta
    remote:
      enabled: true
      url: https://example-admin.okta-emea.com/.well-known/openid-configuration
      user_id:
        from: token
        field: sub
        filter: '^([^@]+)@'
      proxy: http://proxy.corp.example:8080
      # oauth2: lets `kayra token oauth2-login --provider okta` open a
      # real browser against Okta's own /authorize (PKCE, no client secret
      # — a public client, like oc/kubectl's own OIDC plugins) instead of
      # an LDAP bind, printing back Okta's own access token.
      # oauth2:
      #   client_id: "<this CLI's client_id in Okta's app registration>"
      #   scopes: [openid, profile, email]

  gitlab:
    authorization: idm
    remote:
      enabled: true
      url: https://gitlab.example.com/.well-known/openid-configuration
      user_id:
        from: token
        field: user_login

  self:
    # claims, not idm: a self-signed token already is the full trust
    # statement — its own groups claim (see crypto.MintSelfJWT, and
    # `kayra token mint`) is honored directly, never re-checked against
    # a directory. That's what makes it usable to bootstrap a brand new
    # deployment that has no working idm connection yet.
    authorization: self-claims
    local:
      - enabled: true
        algorithm: "RS512"
        audiences: []
        expiry: 3600
        issuer: true
        kid: "12RZfliqysdhfnad"
        # PEM-encoded RSA private key (PKCS1 or PKCS8). This is a
        # throwaway key generated just for this example — generate your
        # own with `openssl genrsa 2048`, never reuse this one.
        secret: |
          -----BEGIN PRIVATE KEY-----
