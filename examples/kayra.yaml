authorizations:
  # self-claims: trusts a self-signed token's own groups claim directly
  # — see authentifications.self above.
  self-claims:
    claims:
      from: token
      groups_field: groups

  # idm: a real LDAP/FreeIPA directory — backs authentifications.gitlab.
  idm:
    ldap:
      enabled: true
      connection:
        host: "ipa.global.example.com"
        port: 636
        bind_dn: "uid=kayra,cn=sysaccounts,cn=etc,dc=ipa,dc=global,dc=example,dc=com"
        password: "changeme"
        timeout: 10
        tls:
          encryption: simple_tls
      options:
        lowercase_usernames: true
        allow_username_or_email_login: true
        cache_ttl: "15m"
      user:
        id: uid
        base: "cn=users,cn=accounts,dc=ipa,dc=global,dc=example,dc=com"
        user_attributes:
          email: mail
          name: cn
        groups:
          member_attribute: memberof
          member_regex: "^cn=(sandbox-\\w+-\\w+),cn=groups,cn=accounts,dc=ipa,dc=global,dc=example,dc=com"

  # okta: resolved straight from Okta's own already-verified token claims
  # — no directory to query, see authentifications.okta above.
  okta:
    claims:
      from: token
      groups_field: MemberOf
      user_attributes:
        email: email
        name: name

  # dev: a local fixture standing in for idm, for testing without a real
  # LDAP server — same group DN shape, filtered the same way.
  dev:
    local:
      path: examples/kayra-users.yaml
      # optional: same drop-non-matches, keep-first-capture-group
      # filtering as above, applied to the fixture's own Groups lists —
      # omit it to author Groups as the final resolved names directly.
      member_regex: "^cn=(sandbox-\\w+-\\w+),cn=groups,cn=accounts,dc=ipa,dc=global,dc=example,dc=com"

sysadmin:
  # Group(s) middleware.SysadminGate requires a caller's resolved
  # groups to intersect, to reach the cluster-bootstrap endpoints
  # (rbac's cluster routes, catalog's api registration/namespace-collection
  # routes). Resolved the exact same way any other endpoint resolves
  # groups — live LDAP lookup, or straight from an already-verified
  # token for a claims-backed authorizations.<name> — so any
  # configured authentifications.<name> (self-signed or remote) can
  # satisfy this, not just a local-signing-key token. Omit entirely
  # (the default) to fall back to a single group:
  # "$platform-core-sysadmin" (e.g. "sandbox-core-sysadmin" here).
  groups:
    - sandbox-core-sysadmin
    - sandbox-platform-admins

reconciler:
  # caps how many reconcile/activate operations `kayra reconciler`
  # runs at once (its goroutine pool size); omit/0 defaults to 30.
  max_concurrent_reconciles: 30
  default_mode: api
  # where every registered api is reachable, as <gateway_url>/apis/<api>/...;
  # each api's OpenAPI spec is fetched from <gateway_url>/apis/<api>/-/openapi.json
  # on every sync. Mandatory: without it, no sync can complete.
  gateway_url: http://localhost:9080

  # mode.<name> is the HTTP step pipeline reconcile actually runs for a
  # api registration whose mode (after default_mode falls back) is <name> — a mode
  # with no entry here keeps the log-only placeholder. Endpoint, every
  # data value, and every headers value renders as a Go text/template
  # against ".Subscription" (Api, Namespace, Platform, Region,
  # CurrentSyncID, ExpectedSyncID) and ".Previous.Outputs" (the
  # preceding step's own outputs; empty for the first step).
  #
  # async: true (default false) fires the call but only waits ~2s for
  # it (catalog.AsyncStepAckTimeout) — whatever happens is logged and
  # ignored, the pipeline always moves on. async: false waits the full
  # timeout; a non-2xx response, a timeout, or a transport error fails
  # the step and aborts the whole pipeline (reconcile fails, and the
  # subscription's current_sync_id is never advanced).
  mode:
    api:
      - method: post
        endpoint: "https://{{ .Subscription.ShortName }}.local.services/api/v1/namespaces/{{ .Subscription.Namespace }}/sync"
        data:
          sync_id: "{{ .Subscription.ExpectedSyncID }}"
        headers:
          Content-Type: "application/json"
          Authorization:
            type: Bearer
            value: "yyyyyyyyyyyyyyyy"
        timeout: "3600s"

      - method: get
        endpoint: "https://{{ .Subscription.ShortName }}.local.services/api/v1/namespaces/{{ .Subscription.Namespace }}/sync/{{ .Subscription.ExpectedSyncID }}"
        headers:
          Content-Type: "application/json"
          Authorization:
            type: Bearer
            value: "yyyyyyyyyyyyyyyy"
        timeout: "3600s" # the whole wait budget: poll every 5s until
                         # wait resolves, or give up (fail) once this
                         # elapses
        wait:
          - key: .status
            successes: [done]
            failures: [skipped, canceled, failed]
